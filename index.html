<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мини-Базис: 3D, 2D и Раскрой</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { display: flex; height: 100vh; background: #1e1e24; color: #fff; overflow: hidden; }
    
    /* Панель управления */
    #sidebar { width: 320px; background: #2b2d42; padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
    h2, h3 { color: #4cc9f0; margin-bottom: 5px; }
    .input-group { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 13px; color: #a5a58d; }
    input { padding: 8px; border-radius: 4px; border: 1px solid #4a4e69; background: #1e1e24; color: #fff; }
    
    /* Основная область */
    #main { flex: 1; display: flex; flex-direction: column; height: 100%; }
    .tabs { display: flex; background: #111119; }
    .tab-btn { padding: 12px 24px; background: none; border: none; color: #888; cursor: pointer; font-weight: bold; }
    .tab-btn.active { color: #4cc9f0; border-bottom: 2px solid #4cc9f0; background: #1e1e24; }
    
    .view-container { flex: 1; position: relative; display: none; background: #141419; }
    .view-container.active { display: flex; justify-content: center; align-items: center; }
    
    canvas { max-width: 100%; max-height: 100%; }
    
    /* Таблица деталировки */
    .parts-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
    .parts-table th, .parts-table td { border: 1px solid #4a4e69; padding: 6px; text-align: left; }
    .parts-table th { background: #1e1e24; color: #4cc9f0; }
  </style>
  <!-- Подключаем Three.js и OrbitControls для 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Левая панель: Ввод параметров -->
  <div id="sidebar">
    <h2>Мини-Базис</h2>
    
    <h3>Габариты шкафа (мм)</h3>
    <div class="input-group">
      <label>Ширина (W):</label>
      <input type="number" id="width" value="800" step="10">
    </div>
    <div class="input-group">
      <label>Высота (H):</label>
      <input type="number" id="height" value="1200" step="10">
    </div>
    <div class="input-group">
      <label>Глубина (D):</label>
      <input type="number" id="depth" value="400" step="10">
    </div>

    <h3>Конструкция</h3>
    <div class="input-group">
      <label>Толщина ЛДСП (мм):</label>
      <input type="number" id="thickness" value="16">
    </div>
    <div class="input-group">
      <label>Количество полок:</label>
      <input type="number" id="shelves" value="2" min="0" max="10">
    </div>

    <h3>Параметры раскроя</h3>
    <div class="input-group">
      <label>Лист ЛДСП (Ш х В):</label>
      <input type="text" value="2750 x 1830" disabled>
    </div>
    <div class="input-group">
      <label>Ширина пропила (мм):</label>
      <input type="number" id="kerf" value="4">
    </div>

    <h3>Деталировка</h3>
    <div id="parts-list"></div>
  </div>

  <!-- Правая область: Вкладки 3D / 2D / Крой -->
  <div id="main">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('3d')">3D Вид</button>
      <button class="tab-btn" onclick="switchTab('2d')">2D Чертеж</button>
      <button class="tab-btn" onclick="switchTab('cutting')">Карта раскроя</button>
    </div>

    <!-- 3D Вид -->
    <div id="view-3d" class="view-container active"></div>

    <!-- 2D Чертеж -->
    <div id="view-2d" class="view-container">
      <canvas id="canvas-2d"></canvas>
    </div>

    <!-- Карта раскроя -->
    <div id="view-cutting" class="view-container">
      <canvas id="canvas-cutting"></canvas>
    </div>
  </div>

  <script>
    // --- Состояние приложения ---
    let params = { W: 800, H: 1200, D: 400, T: 16, shelves: 2, kerf: 4 };
    let parts = [];

    // --- 1. РАСЧЕТ ДЕТАЛИРОВКИ ---
    function calculateParts() {
      const { W, H, D, T, shelves } = params;
      parts = [
        { name: 'Боковина', w: D, h: H, count: 2, color: '#e0a96d' },
        { name: 'Крыша/Дно', w: D, h: W - 2 * T, count: 2, color: '#dd8548' },
        { name: 'Задняя стенка (ХДФ)', w: W - 4, h: H - 4, count: 1, color: '#a5a58d' }
      ];

      if (shelves > 0) {
        parts.push({ name: 'Полка', w: D - 10, h: W - 2 * T, count: shelves, color: '#f4a261' });
      }

      // Отрисовка таблицы
      let html = '<table class="parts-table"><tr><th>Деталь</th><th>Размер (мм)</th><th>Кол-во</th></tr>';
      parts.forEach(p => {
        html += `<tr><td>${p.name}</td><td>${p.h} x ${p.w}</td><td>${p.count}</td></tr>`;
      });
      html += '</table>';
      document.getElementById('parts-list').innerHTML = html;
    }

    // --- 2. 3D ВИЗУАЛИЗАЦИЯ (Three.js) ---
    let scene, camera, renderer, controls, cabinetGroup;

    function init3D() {
      const container = document.getElementById('view-3d');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x141419);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 10000);
      camera.position.set(1500, 1500, 2000);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);

      // Свет
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
      dirLight.position.set(1000, 2000, 1000);
      scene.add(dirLight);

      cabinetGroup = new THREE.Group();
      scene.add(cabinetGroup);

      animate();
    }

    function update3D() {
      // Очистка
      while(cabinetGroup.children.length > 0) { 
        cabinetGroup.remove(cabinetGroup.children[0]); 
      }

      const { W, H, D, T, shelves } = params;
      const mat = new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.6 });
      const edgeMat = new THREE.LineBasicMaterial({ color: 0x000000 });

      function createPanel(w, h, d, x, y, z) {
        const geo = new THREE.BoxGeometry(w, h, d);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, y, z);
        
        // Черные грани для четкости
        const edges = new THREE.EdgesGeometry(geo);
        const line = new THREE.LineSegments(edges, edgeMat);
        mesh.add(line);

        cabinetGroup.add(mesh);
      }

      // Левая и Правая боковины
      createPanel(T, H, D, -W/2 + T/2, H/2, 0);
      createPanel(T, H, D, W/2 - T/2, H/2, 0);

      // Крыша и Дно
      createPanel(W - 2*T, T, D, 0, H - T/2, 0);
      createPanel(W - 2*T, T, D, 0, T/2, 0);

      // Полки
      if (shelves > 0) {
        const innerH = H - 2*T;
        const step = innerH / (shelves + 1);
        for (let i = 1; i <= shelves; i++) {
          createPanel(W - 2*T, T, D - 10, 0, T + i * step, -5);
        }
      }

      // Центрирование камеры
      controls.target.set(0, H/2, 0);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    // --- 3. 2D ЧЕРТЕЖ (Canvas) ---
    function draw2D() {
      const canvas = document.getElementById('canvas-2d');
      const ctx = canvas.getContext('2d');
      canvas.width = 600;
      canvas.height = 600;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const { W, H, T, shelves } = params;
      const scale = Math.min(400 / W, 400 / H);
      const startX = (600 - W * scale) / 2;
      const startY = (600 - H * scale) / 2;

      ctx.strokeStyle = '#4cc9f0';
      ctx.lineWidth = 2;
      ctx.fillStyle = '#2b2d42';

      // Корпус
      ctx.fillRect(startX, startY, W * scale, H * scale);
      ctx.strokeRect(startX, startY, W * scale, H * scale);

      // Внутренние линии (боковины)
      ctx.strokeRect(startX + T * scale, startY + T * scale, (W - 2 * T) * scale, (H - 2 * T) * scale);

      // Полки
      if (shelves > 0) {
        const innerH = H - 2 * T;
        const step = innerH / (shelves + 1);
        for (let i = 1; i <= shelves; i++) {
          const y = startY + (T + i * step) * scale;
          ctx.beginPath();
          ctx.moveTo(startX + T * scale, y);
          ctx.lineTo(startX + (W - T) * scale, y);
          ctx.stroke();
        }
      }

      // Текст размеров
      ctx.fillStyle = '#fff';
      ctx.font = '14px sans-serif';
      ctx.fillText(`${W} мм`, startX + (W * scale) / 2 - 20, startY - 10);
      ctx.fillText(`${H} мм`, startX - 55, startY + (H * scale) / 2);
    }

    // --- 4. МОДУЛЬ РАСКРОЯ (Nesting / Guillotine algorithm) ---
    function drawCutting() {
      const canvas = document.getElementById('canvas-cutting');
      const ctx = canvas.getContext('2d');
      canvas.width = 800;
      canvas.height = 550;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Размеры листа ЛДСП
      const sheetW = 2750;
      const sheetH = 1830;
      const scale = 700 / sheetW;

      const offX = 50, offY = 50;

      // Отрисовка основного листа ЛДСП
      ctx.fillStyle = '#2b2d42';
      ctx.fillRect(offX, offY, sheetW * scale, sheetH * scale);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.strokeRect(offX, offY, sheetW * scale, sheetH * scale);

      // Простой гильотинный алгоритм укладки
      let curX = offX;
      let curY = offY;
      let maxHeightInRow = 0;
      const kerfScaled = params.kerf * scale;

      // Подготовка списка всех отдельных деталей
      let allPieces = [];
      parts.forEach(p => {
        // Задник ХДФ не считаем на листе ЛДСП
        if (p.name.includes('ХДФ')) return; 
        for (let i = 0; i < p.count; i++) {
          allPieces.push({ name: p.name, w: p.h, h: p.w, color: p.color });
        }
      });

      // Сортировка деталей по высоте (для лучшей укладки)
      allPieces.sort((a, b) => b.h - a.h);

      ctx.font = '10px sans-serif';

      allPieces.forEach(p => {
        const pw = p.w * scale;
        const ph = p.h * scale;

        // Переход на новую строку, если не влезает по ширине
        if (curX + pw > offX + sheetW * scale) {
          curX = offX;
          curY += maxHeightInRow + kerfScaled;
          maxHeightInRow = 0;
        }

        // Отрисовка детали на карте
        ctx.fillStyle = p.color;
        ctx.fillRect(curX, curY, pw, ph);
        ctx.strokeStyle = '#000';
        ctx.strokeRect(curX, curY, pw, ph);

        // Подпись детали
        ctx.fillStyle = '#000';
        if (pw > 30 && ph > 15) {
          ctx.fillText(`${p.name}`, curX + 4, curY + 12);
          ctx.fillText(`${p.h}x${p.w}`, curX + 4, curY + 24);
        }

        curX += pw + kerfScaled;
        if (ph > maxHeightInRow) maxHeightInRow = ph;
      });

      // Подпись размеров листа
      ctx.fillStyle = '#4cc9f0';
      ctx.font = '12px sans-serif';
      ctx.fillText(`Лист ЛДСП: ${sheetW} x ${sheetH} мм`, offX, offY - 10);
    }

    // --- Управление UI и события ---
    function updateAll() {
      params.W = parseFloat(document.getElementById('width').value) || 0;
      params.H = parseFloat(document.getElementById('height').value) || 0;
      params.D = parseFloat(document.getElementById('depth').value) || 0;
      params.T = parseFloat(document.getElementById('thickness').value) || 16;
      params.shelves = parseInt(document.getElementById('shelves').value) || 0;
      params.kerf = parseFloat(document.getElementById('kerf').value) || 4;

      calculateParts();
      update3D();
      draw2D();
      drawCutting();
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));

      if (tab === '3d') {
        document.getElementById('view-3d').classList.add('active');
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
      } else if (tab === '2d') {
        document.getElementById('view-2d').classList.add('active');
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        draw2D();
      } else if (tab === 'cutting') {
        document.getElementById('view-cutting').classList.add('active');
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        drawCutting();
      }
    }

    // Слушатели изменений параметров
    document.querySelectorAll('#sidebar input').forEach(input => {
      input.addEventListener('input', updateAll);
    });

    // Инициализация при старте
    window.onload = () => {
      init3D();
      updateAll();
    };

    // Адаптивность 3D при изменении окна
    window.onresize = () => {
      const container = document.getElementById('view-3d');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    };
  </script>
</body>
</html>
